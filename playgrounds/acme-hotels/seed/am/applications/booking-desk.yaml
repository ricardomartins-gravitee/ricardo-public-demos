# A hosted delegated agent: the kind Access Management lists under Agents, and the kind that exchanges a
# token for the signed-in guest. The kind gives it client credentials and token exchange. The concierge
# is the same kind and forwards the guest's token instead of exchanging one.
name: Booking desk
description: The booking desk, which acts for the guest when it lists bookings
type: AGENT
kind: HOSTED_DELEGATED

clientId: acme-hotels-booking-desk
clientSecret: "${AGENT_CLIENT_SECRET}"

redirectUris:
  - "${HOTELS_WEB_URL}/" # The website. The desk does not send the guest there; this kind requires a redirect

oauth:
  tokenCustomClaims:
    - tokenType: access_token
      claimName: email
      claimValue: "{#context.attributes['user']['username']}"
