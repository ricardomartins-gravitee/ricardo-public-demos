# Kept so a lab seeded earlier loses the exchange. The booking desk is the only client that exchanges.
name: Hotels AI Agent
description: Retired. The booking desk exchanges the guest's token. This client cannot.
type: SERVICE

clientId: hotel-ai-agent
clientSecret: "${AGENT_CLIENT_SECRET}"

oauth:
  grantTypes:
    - client_credentials
  tokenEndpointAuthMethod: client_secret_basic
  pkce: false
  tokenValidity:
    accessToken: 900
    refreshToken: 14400
    idToken: 900
