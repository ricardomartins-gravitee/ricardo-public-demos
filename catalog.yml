# What the Lab reads to show this catalog. Raise the version with make release when items change in a way people should notice.
x-gravitee-catalog:
  schema: 1   # For older Gravitee Labs: written by catalog.py
  id: "ricardo-public-demos"
  name: "Ricardo's public demos"
  description: "Demos for Gravitee Lab"
  version: 0.1.0
  lab: 7   # For older Gravitee Labs: written by catalog.py. Shared policy groups need this level.
  shared_settings: [OLLAMA_URL] # Ollama on this machine, read by the playgrounds that call it
  license: "UNLICENSED"
  images: ghcr.io/ricardomartins-gravitee/ricardo-public-demos
  requires:
    catalogs:
      gravitee:
        name: "Gravitee public"
        url: https://github.com/gravitee-io-labs/gravitee-lab-public-catalog.git
        min: 1.5.0
